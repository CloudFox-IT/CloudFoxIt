name: Copie des données PMU

on:
  schedule:
    - cron: '*/15 6-23 * * *'   # toutes les 15 min de 7 h à minuit (heure de Paris, environ)
  workflow_dispatch:            # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: pmu-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Récupérer la copie précédente
        run: |
          git fetch --depth=1 origin pmu-data && git worktree add prev origin/pmu-data || mkdir -p prev
      - name: Copier les données du PMU
        run: node .github/scripts/pmu-sync.mjs
      - name: Publier sur la branche pmu-data
        run: |
          cd out
          git init -q -b pmu-data
          git config user.name "pmu-sync"
          git config user.email "pmu-sync@users.noreply.github.com"
          git add -A
          git commit -q -m "Données PMU $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pmu-data
